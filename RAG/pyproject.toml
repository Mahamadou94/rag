[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "Rag Pipeline"
version = "0.0.1"
description = ""
requires-python = ">=3.12"
dependencies = [
    "qdrant-client",
    "opensearch-py",
    "langchain",
    "langchain-openai",
    "langchainhub",
    "langchain-community",
    "crewai",
    "crewai-tools",
    "ipykernel",
    "python-dotenv",
    "langgraph",
    "openai>=2.44.0",
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
    "paddleocr>=3.7.0",
    "paddlepaddle>=3.3.1",
    "sentence-transformers>=5.6.1",
    "transformers>=5.14.1",
    "torch>=2.13.0",
    "flagembedding>=1.4.0",
    "ragas>=0.2.7",
    "datasets>=2.19.0",
]

[tool.setuptools.packages.find]
where = ["."]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
